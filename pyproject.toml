[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-miniquant"
version = "0.1.0"
description = "Auditable personal systematic trading research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["numpy==1.26.4", "matplotlib==3.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
